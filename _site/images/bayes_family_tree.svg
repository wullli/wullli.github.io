<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 416" width="1000" height="416" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#808080"/>
    </marker>
  </defs>
  <g transform="translate(0 -10)">
    <g stroke="#808080" stroke-width="2" fill="none">
      <path d="M280 72 L280 100 L150 100 L150 128"/>
      <path d="M280 100 L410 100 L410 128"/>
      <path d="M410 282 L410 338"/>
    </g>
    <path d="M410 172 L410 238" stroke="#d64a3c" stroke-width="2.5" stroke-dasharray="7 5" fill="none"/>

    <g font-size="15" text-anchor="middle" fill="#222">
      <g fill="#e8eef6" stroke="#4a6fa5" stroke-width="1.5">
        <rect x="205" y="28" width="150" height="44" rx="8"/>
        <rect x="75" y="128" width="150" height="44" rx="8"/>
        <rect x="335" y="128" width="150" height="44" rx="8"/>
        <rect x="335" y="238" width="150" height="44" rx="8"/>
        <rect x="335" y="338" width="150" height="44" rx="8"/>
      </g>
      <text x="280" y="55">Joshua Bayes</text>
      <text x="150" y="155">Thomas Bayes</text>
      <text x="410" y="155">Nathaniel Bayes</text>
      <text x="410" y="265">William</text>
      <text x="410" y="365">You</text>
    </g>

    <g font-size="13" fill="#222">
      <rect x="320" y="194" width="80" height="24" rx="12" fill="#fbe4e1" stroke="#d64a3c" stroke-width="1"/>
      <text x="360" y="211" text-anchor="middle">P = 0.6</text>
    </g>
  </g>

  <g transform="translate(460 25)">

  <path d="M246 120 L392 120" stroke="#808080" stroke-width="2" marker-end="url(#arrow)"/>

  <g text-anchor="middle" fill="#222" font-size="14">
    <circle cx="200" cy="120" r="46" fill="#e8eef6" stroke="#4a6fa5" stroke-width="1.5"/>
    <text x="200" y="116">Father of</text>
    <text x="200" y="133">William</text>

    <circle cx="440" cy="120" r="46" fill="#c9c9c9" stroke="#444" stroke-width="2"/>
    <text x="440" y="116">DNA</text>
    <text x="440" y="133">match</text>
  </g>

  <g font-size="12.5" fill="#222">
    <rect x="120" y="186" width="160" height="80" rx="8" fill="#f0f0f0" stroke="#808080" stroke-width="1"/>
    <text x="200" y="208" text-anchor="middle" font-weight="bold">P(father)</text>
    <text x="134" y="232">Nathaniel</text>
    <text x="266" y="232" text-anchor="end">0.6</text>
    <text x="134" y="252">stranger</text>
    <text x="266" y="252" text-anchor="end">0.4</text>

    <rect x="360" y="186" width="160" height="80" rx="8" fill="#f0f0f0" stroke="#808080" stroke-width="1"/>
    <text x="440" y="208" text-anchor="middle" font-weight="bold">P(match | father)</text>
    <text x="374" y="232">Nathaniel</text>
    <text x="506" y="232" text-anchor="end">0.3</text>
    <text x="374" y="252">stranger</text>
    <text x="506" y="252" text-anchor="end">0.01</text>
  </g>
</g>
  <g font-size="15" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="280" y="400">(a) Family tree</text>
    <text x="780" y="400">(b) Probabilistic graphical model</text>
  </g>
  <g font-size="12" fill="#222" transform="translate(235 -413)">
    <path d="M247 429 L277 429" stroke="#808080" stroke-width="2"/>
    <text x="285" y="433">certain parent (P = 1)</text>
    <path d="M439 429 L469 429" stroke="#d64a3c" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="477" y="433">uncertain parent</text>
    <circle cx="604" cy="429" r="8" fill="#e8eef6" stroke="#4a6fa5" stroke-width="1.5"/>
    <text x="618" y="433">latent</text>
    <circle cx="682" cy="429" r="8" fill="#c9c9c9" stroke="#444" stroke-width="2"/>
    <text x="696" y="433">observed</text>
  </g>
</svg>
