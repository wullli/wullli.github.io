  <script>
    function renderYearGroup(year, entries, linkMap, startNum) {
      return [
        '<div class="pub-year-group">',
        '  <div class="pub-year-label">' + esc(year) + '</div>',
        entries.map(function(e, i) { return renderEntry(e, linkMap[e.citationKey], startNum + i); }).join('\n'),
        '</div>'
      ].join('\n');
    }

    function render(entries, linkMap) {
      var indexed = entries.map(function(e, i) { return { e: e, i: i }; });
      indexed.sort(function(a, b) {
        var diff = (parseInt(clean(b.e.entryTags.YEAR), 10) || 0) - (parseInt(clean(a.e.entryTags.YEAR), 10) || 0);
        return diff !== 0 ? diff : a.i - b.i;
      });
      entries = indexed.map(function(x) { return x.e; });

      var byYear = Object.create(null);
      entries.forEach(function(e) {
        var y = clean(e.entryTags.YEAR) || 'n.d.';
        (byYear[y] = byYear[y] || []).push(e);
      });

      var years = Object.keys(byYear).sort(function(a, b) { return Number(b) - Number(a); });
      var idx = 1;
      document.getElementById('pub-container').innerHTML = years.map(function(y) {
        var html = renderYearGroup(y, byYear[y], linkMap, idx);
        idx += byYear[y].length;
        return html;
      }).join('');

      var n = entries.length;
    }

    (function() {
      if (document.getElementById('pub-container').querySelector('.pub-entry')) return;

      var bibEntries = null;
      var linkMap    = null;

      function tryRender() {
        if (bibEntries !== null && linkMap !== null) render(bibEntries, linkMap);
      }

      loadLinkMap(function(lm) { linkMap = lm; tryRender(); });

      fetch('./publications.bib')
        .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(function(raw) { bibEntries = parseBibTeX(raw); tryRender(); })
        .catch(function() {
          document.getElementById('pub-summary').textContent = '';
          document.getElementById('pub-container').innerHTML =
            '<p style="color:var(--fg-muted);font-style:italic">Could not load publications.bib. ' +
            'Serve locally with <code style="font-family:var(--font-mono)">python3 -m http.server</code>.</p>';
        });
    }());
  </script>
